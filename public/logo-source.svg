      <circle r="48" fill="#c4202d"/>
      <rect x="-10" y="-30" width="20" height="60" fill="#ffffff"/>
      <rect x="-30" y="-10" width="60" height="20" fill="#ffffff"/>
    </g>
  </g>
</svg>
